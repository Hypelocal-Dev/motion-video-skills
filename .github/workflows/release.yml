name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub doesn't run workflows on pull requests opened with GITHUB_TOKEN, so the
      # required checks never start on release-please's PR and branch protection blocks it.
      # Start CI on the release branch by hand (workflow_dispatch is allowed), and run the
      # PR title check here, reporting it under the same status name.
      - name: Run required checks on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH=release-please--branches--main
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json title,headRefOid --jq '.[0] // empty')
          [ -z "$PR" ] && { echo "no open release PR"; exit 0; }
          TITLE=$(jq -r .title <<<"$PR"); SHA=$(jq -r .headRefOid <<<"$PR")
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          RE='^chore(\([a-z0-9-]+\))?: release .+'
          if [[ "$TITLE" =~ $RE ]]; then STATE=success; else STATE=failure; fi
          gh api "repos/$REPO/statuses/$SHA" -f state="$STATE" -f context="Conventional commit title" \
            -f description="release-please PR title: $TITLE"

  samples:
    name: Attach sample renders
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [square-loop, wide-explainer]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Render
        working-directory: motion-video/templates/${{ matrix.template }}
        run: npx --yes hyperframes render -q delivery -f 60 -o renders/${{ matrix.template }}.mp4
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" motion-video/templates/${{ matrix.template }}/renders/${{ matrix.template }}.mp4 --clobber
