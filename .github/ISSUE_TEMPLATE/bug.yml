name: Bug report
description: Something broke or rendered wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. Paste errors as text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. /new-video square-loop ~/videos/test\n2. ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor.sh output
      description: Run motion-video/scripts/doctor.sh (or /video-doctor) and paste the result.
      render: text
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in /plugin, or in motion-video/.claude-plugin/plugin.json
