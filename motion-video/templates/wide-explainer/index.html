<!doctype html>
<!--
  wide-explainer template: 1920x1080 narrated explainer with word-by-word captions.

  How it works
  - Scenes are stacked full-frame layers. Each transition hides the outgoing scene after it
    finishes, so hidden scenes never count against contrast checks.
  - CAPTIONS is generated by scripts/captions.py from the voiceover word timings. Each page
    shows until `end`; the current word gets the highlight.
  - The end card has a CTA button with a cursor click and seeded confetti. Remove both if a
    real button sits next to the video on the page.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --brand: #6c4cf5;
        --brand-deep: #2c1d7a;
        --ink: #1b1733;
        --navy: #221a52;
        --gray: #57537a;
        --line: #e9e6f5;
        --soft: #f7f6fd;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ebe8fb; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Plus Jakarta Sans", sans-serif; color: var(--navy); background: #ebe8fb; }
      .scene { position: absolute; inset: 0; }
      .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 1300px 900px at 900px 480px, #f8f7fe 0%, #e8e4fb 100%); }

      /* scene 1: spreadsheets */
      .sheet { position: absolute; width: 760px; height: 460px; border-radius: 18px; background: #fff; box-shadow: 0 24px 60px rgba(40, 30, 120, 0.16); overflow: hidden; }
      .sheet .sb { height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #eef0f3; font-size: 20px; font-weight: 800; color: #5b6075; }
      .sheet .sb i { width: 22px; height: 22px; border-radius: 5px; background: #2e9e5b; }
      .grid { display: grid; grid-template-columns: repeat(5, 1fr); }
      .grid div { height: 44px; border-right: 1px solid #e6e8ee; border-bottom: 1px solid #e6e8ee; font-size: 17px; font-weight: 600; color: #4a4f63; padding: 10px 12px; white-space: nowrap; overflow: hidden; }
      .flag { position: absolute; right: 20px; top: 70px; height: 44px; padding: 0 18px; border-radius: 22px; background: #fde4e2; color: #b42318; font-size: 20px; font-weight: 800; display: flex; align-items: center; }

      /* scene 2: shared calendar */
      #cal { position: absolute; left: 260px; top: 120px; width: 1400px; height: 700px; border-radius: 28px; background: #fff; box-shadow: 0 30px 80px rgba(40, 30, 120, 0.14); overflow: hidden; }
      #cal .ch { height: 80px; display: flex; align-items: center; gap: 16px; padding: 0 32px; border-bottom: 2px solid var(--line); font-size: 28px; font-weight: 800; }
      #cal .ch .mk { width: 40px; height: 40px; border-radius: 12px; background: var(--brand); display: flex; align-items: center; justify-content: center; }
      #team { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: var(--gray); }
      #team .avs { display: flex; }
      #team .avs i { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; margin-left: -10px; }
      .day { position: absolute; top: 80px; width: 267px; height: 620px; border-right: 2px solid var(--line); }
      .day h5 { height: 56px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--gray); border-bottom: 2px solid var(--line); }
      .ev { position: absolute; left: 14px; width: 239px; height: 96px; border-radius: 16px; padding: 14px 16px; }
      .ev b { display: block; font-size: 20px; font-weight: 800; }
      .ev i { display: block; font-style: normal; font-size: 16px; font-weight: 700; margin-top: 4px; opacity: 0.85; }
      .shift { background: #e3ecff; color: #1d3aa8; } .swap { background: #fff1cc; color: #7a5000; } .class { background: #ffe4ef; color: #9d1d52; }

      /* end card */
      #wipe { position: absolute; left: 960px; top: 540px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; border-radius: 50%; background: var(--brand-deep); z-index: 30; }
      #end { position: absolute; inset: 0; z-index: 31; opacity: 0; background: radial-gradient(ellipse 900px 700px at 1500px 300px, #5a3fe0 0%, transparent 70%), var(--brand-deep); }
      #end .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 250px; }
      #logo { display: flex; align-items: center; gap: 24px; font-size: 110px; font-weight: 800; letter-spacing: -0.04em; color: #fff; }
      #logo .mk { width: 130px; height: 130px; border-radius: 36px; background: #fff; display: flex; align-items: center; justify-content: center; }
      #cta { margin-top: 80px; width: 480px; height: 112px; border-radius: 56px; background: #fff; color: var(--brand-deep); font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
      #confetti { position: absolute; left: 960px; top: 528px; z-index: 32; }
      #confetti i { position: absolute; width: 14px; height: 8px; border-radius: 2px; }
      .cursor { position: absolute; left: 0; top: 0; width: 46px; height: 58px; z-index: 40; }

      /* captions */
      #caps { position: absolute; left: 0; right: 0; top: 900px; height: 72px; z-index: 50; }
      .cap { position: absolute; left: 50%; top: 0; height: 72px; transform: translateX(-50%); padding: 0 14px; border-radius: 18px; background: rgba(27, 23, 51, 0.92);
        display: flex; align-items: center; white-space: nowrap; box-shadow: 0 14px 34px rgba(20, 10, 60, 0.25); }
      .cap span { padding: 4px 6px; margin: 0 1px; border-radius: 9px; font-size: 38px; font-weight: 800; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <audio id="music" data-start="0" data-duration="13" data-track-index="0" src="assets/music.wav" data-volume="1"></audio>
      <audio id="vo1" data-start="0.2" data-duration="3.37" data-track-index="1" src="assets/vo/l1.wav"></audio>
      <audio id="vo2" data-start="4.0" data-duration="3.99" data-track-index="2" src="assets/vo/l2.wav"></audio>
      <audio id="vo3" data-start="8.5" data-duration="1.6" data-track-index="1" src="assets/vo/l3.wav"></audio>

      <div class="bg"></div>

      <div class="scene" id="s1"></div>

      <div class="scene" id="s2">
        <div id="cal">
          <div class="ch"><div class="mk"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Team calendar
            <div id="team"><div class="avs"><i style="background: #b9c6ff"></i><i style="background: #ffd28a"></i><i style="background: #ffadc9"></i><i style="background: #a6e3c4"></i></div>Shared with your team</div></div>
          <div id="days"></div>
        </div>
      </div>

      <div id="wipe"></div>
      <div id="end">
        <div class="wrap">
          <div id="logo"><div class="mk"><svg width="76" height="76" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#2c1d7a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Brightdesk</div>
          <div id="cta">Start free trial</div>
        </div>
        <div id="confetti"></div>
        <svg class="cursor" id="cur" viewBox="0 0 46 58"><path d="M4 3l0 44 11-10 8 18 8-4-8-17 15-1z" fill="#fff" stroke="#1b1733" stroke-width="3" stroke-linejoin="round"/></svg>
      </div>

      <div id="caps"></div>
    </div>

    <script>
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---- Generated by scripts/captions.py
      const CAPTIONS = [
        { end: 2.09, words: [["Your", 0.25], ["team's", 0.46], ["schedule", 0.85], ["lives", 1.55], ["in", 1.98]] },
        { end: 3.57, words: [["five", 2.09], ["different", 2.32], ["spreadsheets.", 2.85]] },
        { end: 5.75, words: [["Brightdesk", 4.05], ["puts", 4.69], ["every", 4.94], ["shift,", 5.32]] },
        { end: 7.04, words: [["swap", 5.78], ["and", 6.08], ["class", 6.24], ["in", 6.67], ["one", 6.81]] },
        { end: 7.88, words: [["shared", 7.04], ["calendar.", 7.39]] },
        { end: 9.91, words: [["Start", 8.59], ["your", 8.77], ["free", 8.99], ["trial", 9.21], ["today.", 9.48]] },
      ];

      // ---- Scene 1 content: five spreadsheets
      const SHEETS = ["Shifts v3", "Swaps FINAL", "Classes (old)", "Rota", "Copy of Rota"];
      const CELLS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Ana", "Ben", "?", "Ana", "Cal", "Dev", "Ana", "Ben", "Dev", "?",
        "Cal", "?", "Ana", "Ben", "Cal", "Ben", "Dev", "Cal", "?", "Ana", "Dev", "Ana", "Ben", "Cal", "Dev"];
      const s1 = document.getElementById("s1");
      SHEETS.forEach((name, i) => {
        s1.insertAdjacentHTML("beforeend",
          `<div class="sheet" id="sh${i}" style="left:${330 + i * 120}px;top:${110 + i * 70}px">` +
          `<div class="sb"><i></i>${name}.xlsx</div><div class="grid">${CELLS.map((c) => `<div>${c}</div>`).join("")}</div>` +
          (i === 4 ? '<div class="flag" id="flag">3 conflicts</div>' : "") + "</div>");
      });

      // ---- Scene 2 content: the shared calendar
      const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
      // [day index, top, type, title, detail]
      const EVENTS = [
        [0, 70, "shift", "Front desk", "Ana · 8:00 AM"], [2, 70, "shift", "Front desk", "Ben · 8:00 AM"], [4, 70, "shift", "Front desk", "Cal · 8:00 AM"],
        [1, 182, "swap", "Swap approved", "Dev covers Ana"], [3, 182, "swap", "Swap approved", "Ben covers Cal"],
        [0, 294, "class", "Sunrise Yoga", "7:00 AM · Studio A"], [2, 294, "class", "Core Flow", "12:00 PM · Studio B"], [4, 294, "class", "Evening Stretch", "6:30 PM · Studio A"],
      ];
      document.getElementById("days").innerHTML = DAYS.map((d, i) =>
        `<div class="day" style="left:${i * 280}px"><h5>${d}</h5></div>`).join("") +
        EVENTS.map((e, i) => `<div class="ev ${e[2]}" id="ev${i}" style="left:${e[0] * 280 + 14}px;top:${80 + e[1]}px"><b>${e[3]}</b><i>${e[4]}</i></div>`).join("");

      // ---- Captions markup
      const caps = document.getElementById("caps");
      CAPTIONS.forEach((p, i) => {
        caps.insertAdjacentHTML("beforeend", `<div class="cap" id="cap${i}">${p.words.map((w, j) => `<span id="w${i}_${j}">${w[0]}</span>`).join("")}</div>`);
      });

      // ---- Confetti (seeded, so every render matches)
      const rand = mulberry32(7);
      const COLORS = ["#ffffff", "#ffd28a", "#ffadc9", "#a6e3c4", "#b9c6ff"];
      const conf = document.getElementById("confetti");
      for (let i = 0; i < 70; i++) conf.insertAdjacentHTML("beforeend", `<i id="c${i}" style="background:${COLORS[i % COLORS.length]}"></i>`);

      // ---- Timeline
      const tl = gsap.timeline({ paused: true });
      gsap.set([".sheet", "#flag", "#s2", ".ev", "#team", "#confetti i", "#cur"], { opacity: 0 });
      gsap.set(".cap", { opacity: 0 });
      gsap.set("#wipe", { scale: 0 });

      // captions: each page shows from its first word to `end`; the current word is highlighted
      CAPTIONS.forEach((p, i) => {
        const start = p.words[0][1] - 0.05;
        tl.to("#cap" + i, { opacity: 1, duration: 0.08 }, start);
        p.words.forEach((w, j) => {
          tl.set(`#w${i}_${j}`, { backgroundColor: "#6c4cf5" }, w[1]);
          if (j > 0) tl.set(`#w${i}_${j - 1}`, { backgroundColor: "rgba(108,76,245,0)" }, w[1]);
        });
        tl.to("#cap" + i, { opacity: 0, duration: 0.08 }, p.end);
      });

      // Scene 1: spreadsheets pile up (0 - 3.8)
      tl.fromTo(".sheet", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.38, ease: "power3.out", immediateRender: false }, 0.3);
      tl.fromTo("#flag", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, 2.9);

      // Transition 1 -> 2: zoom through
      tl.to("#s1", { scale: 1.25, opacity: 0, duration: 0.5, ease: "power2.in" }, 3.7);
      tl.fromTo("#s2", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 3.95);
      tl.set("#s1", { visibility: "hidden" }, 4.3);

      // Scene 2: one shared calendar (3.8 - 8.2)
      [[0, 4.95], [1, 5.05], [2, 5.15], [3, 5.8], [4, 5.9], [5, 6.25], [6, 6.35], [7, 6.45]].forEach(([i, t]) =>
        tl.fromTo("#ev" + i, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t));
      tl.fromTo("#team", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 6.9);

      // Transition 2 -> end card: brand circle wipe
      tl.to("#wipe", { scale: 1, duration: 0.6, ease: "power3.in" }, 7.95);
      tl.to("#end", { opacity: 1, duration: 0.01 }, 8.55);
      tl.set("#s2", { visibility: "hidden" }, 8.6);
      tl.fromTo("#logo", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 8.6);
      tl.fromTo("#cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 8.9);

      // CTA click with confetti
      tl.set("#cur", { x: 1300, y: 900, opacity: 1 }, 9.0);
      tl.to("#cur", { x: 985, y: 545, duration: 0.55, ease: "power2.inOut" }, 9.05);
      tl.to("#cur", { scale: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, 9.62);
      tl.to("#cta", { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1 }, 9.62);
      for (let i = 0; i < 70; i++) {
        const a = rand() * Math.PI * 2, r = 220 + rand() * 380;
        tl.fromTo("#c" + i, { x: 0, y: 0, opacity: 1, rotation: 0 },
          { x: Math.cos(a) * r, y: Math.sin(a) * r * 0.7 + 260, rotation: rand() * 720 - 360, opacity: 0, duration: 1.6, ease: "power2.out", immediateRender: false }, 9.7);
      }
      tl.to("#cur", { opacity: 0, duration: 0.3 }, 10.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
