<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video editor</title>
<style>
  :root {
    --bg: #0e0f11;
    --bg-2: #141518;
    --panel: #1a1b1f;
    --panel-2: #23252a;
    --line: #2b2d33;
    --line-2: #3a3d45;
    --text: #ecedef;
    --muted: #a0a5ae;
    --faint: #6d727c;
    --accent: #f5a524;
    --accent-ink: #1c1405;
    --done: #3fb27f;
    --done-ink: #04150d;
    --claude: #e08a6a;
    --danger: #f06363;
    --focus: #7aa7ff;
    --radius: 8px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8;
       stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .i .f { fill: currentColor; stroke: none; }

  /* header */
  .top { flex: none; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px;
         background: var(--bg-2); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand small { color: var(--faint); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .brand strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 260px; }
  .spacer { flex: 1; }
  .listen { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .listen.on .dot { background: var(--done); box-shadow: 0 0 0 3px rgba(63,178,127,.18); }
  .listen.busy .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .listen.wait .dot { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; } }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel);
         border-radius: 7px; padding: 6px 12px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: default; filter: none; }
  .btn.small { padding: 3px 10px; font-size: 13px; }
  kbd { font: 11px var(--mono); opacity: .7; }

  /* layout */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .viewer { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; padding: 12px 16px 16px; }
  .banner { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--radius);
            background: rgba(245,165,36,.12); border: 1px solid rgba(245,165,36,.35); font-size: 13px; }
  .chip.warn { color: var(--accent); border-color: rgba(245,165,36,.4); }

  /* stage */
  .stage { position: relative; flex: 1; min-height: 160px; background: #060607; border-radius: var(--radius); overflow: hidden; }
  .frame-box { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .frame-box video { display: block; width: 100%; height: 100%; background: #000; }
  .overlay { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  .box { position: absolute; pointer-events: none; border: 2px solid var(--accent); background: rgba(245,165,36,.10);
         box-shadow: 0 0 0 1px rgba(0,0,0,.65), inset 0 0 0 1px rgba(0,0,0,.35); }
  .box.draft { border-style: dashed; }
  .box .tag { position: absolute; left: -2px; bottom: 100%; background: var(--accent); color: var(--accent-ink);
              font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px 4px 4px 0; white-space: nowrap; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .empty code { font: 12px var(--mono); color: var(--text); }

  /* transport */
  .transport { display: flex; align-items: center; gap: 4px; flex: none; }
  .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px;
              background: none; color: var(--muted); }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn.play { width: 38px; height: 38px; color: var(--text); background: var(--panel); }
  .time { font: 13px var(--mono); margin-left: 8px; white-space: nowrap; }
  .frame-no { font: 12px var(--mono); color: var(--faint); margin-left: 8px; white-space: nowrap; }
  .transport select { padding: 3px 6px; font-size: 12px; }

  /* timeline */
  .timeline { position: relative; flex: none; height: 38px; cursor: pointer; touch-action: none; user-select: none; }
  .track { position: absolute; left: 0; right: 0; top: 24px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress { height: 100%; width: 0; background: var(--muted); }
  .playhead { position: absolute; top: 18px; width: 2px; height: 18px; margin-left: -1px; background: var(--text); pointer-events: none; border-radius: 1px; }
  .markers { position: absolute; inset: 0; }
  .marker { position: absolute; top: 0; transform: translateX(-50%); width: 20px; height: 20px; padding: 0; border-radius: 50%;
            display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 10px/1 var(--mono);
            border: 2px solid var(--bg); }
  .marker.done { background: var(--done); color: var(--done-ink); opacity: .75; }
  .marker.selected { box-shadow: 0 0 0 2px var(--text); z-index: 2; }
  .marker.draft { background: var(--bg); border: 2px dashed var(--accent); pointer-events: none; }
  .range { position: absolute; top: 24px; height: 6px; background: var(--accent); opacity: .55; border-radius: 3px; pointer-events: none; }
  .range.done { background: var(--done); opacity: .35; }

  /* composer */
  .composer { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .composer:focus-within { border-color: var(--line-2); }
  .composer-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--bg-2);
          border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  button.chip:hover { color: var(--text); border-color: var(--faint); }
  .chip.time-chip { font-family: var(--mono); color: var(--text); }
  .chip.time-chip.pinned { border-color: var(--accent); }
  .chip.ghost { border-style: dashed; background: none; }
  .chip.area { color: var(--accent); border-color: rgba(245,165,36,.5); }
  textarea.note { display: block; width: 100%; resize: none; border: 0; background: none; outline: none; padding: 4px 0;
                  min-height: 44px; max-height: 160px; line-height: 1.45; }
  textarea.note::placeholder { color: var(--faint); }
  .attach-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
  .file { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; border: 1px solid var(--line-2); border-radius: 6px;
          padding: 3px 6px 3px 3px; font-size: 12px; background: var(--bg-2); }
  .file img, .file .ph { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; background: var(--panel-2);
                         display: grid; place-items: center; color: var(--muted); flex: none; }
  .file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file button { border: 0; background: none; color: var(--faint); padding: 0 2px; }
  .file button:hover { color: var(--text); }
  .composer-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .hint { color: var(--faint); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link { border: 0; background: none; color: var(--muted); padding: 4px 6px; font-size: 13px; }
  .link:hover { color: var(--text); }

  /* notes panel */
  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--bg-2); border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: none; color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 13px; }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--text); }
  .tab .n { margin-left: 4px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .notes { flex: 1; overflow: auto; padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 8px; }
  .notes .hello { color: var(--muted); font-size: 13px; padding: 12px 4px; }
  .notes .hello ul { padding-left: 18px; margin: 8px 0 0; }
  .notes .hello li { margin: 4px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; }
  .card:hover { border-color: var(--line-2); }
  .card.selected { border-color: var(--accent); }
  .card.done { opacity: .72; }
  .card-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .card-head .icon-btn { width: 28px; height: 28px; }
  .num { background: var(--accent); color: var(--accent-ink); font: 700 11px/18px var(--mono); padding: 0 6px; border-radius: 4px; }
  .card.done .num { background: var(--done); color: var(--done-ink); }
  .tc { font-family: var(--mono); color: var(--text); white-space: nowrap; }
  .grow { flex: 1; }
  .tiny { font-size: 11px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
  .card-text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .files a { color: inherit; text-decoration: none; }
  .thread { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .reply { font-size: 13px; }
  .reply .who { font-weight: 600; margin-right: 6px; }
  .reply.claude .who { color: var(--claude); }
  .reply .when { color: var(--faint); font-size: 11px; }
  .reply .body { white-space: pre-wrap; overflow-wrap: anywhere; color: #d6d8dc; }
  .reply-box { display: flex; gap: 6px; margin-top: 10px; align-items: flex-end; }
  .reply-box textarea { flex: 1; resize: none; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 6px;
                        padding: 6px 8px; min-height: 34px; max-height: 120px; font-size: 13px; outline: none; }
  .reply-box textarea:focus { border-color: var(--faint); }

  .dropzone { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(14,15,17,.82);
              border: 3px dashed var(--accent); font-size: 18px; font-weight: 600; pointer-events: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; max-width: min(560px, calc(100vw - 32px));
           background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 10px 14px;
           box-shadow: 0 8px 30px rgba(0,0,0,.45); font-size: 13px; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    main { grid-template-columns: 1fr; }
    .viewer { padding: 12px 16px; }
    .stage { flex: none; height: 56vh; }
    .panel { border-left: 0; border-top: 1px solid var(--line); min-height: 50vh; }
    .listen span:last-child { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><small>Editor</small><strong id="project">Loading…</strong></div>
  <select id="renderSelect" aria-label="Render to watch" hidden></select>
  <span id="staleChip" class="chip warn" hidden title="The composition was edited after this render. Ask Claude to render again.">Changed since this render</span>
  <div class="spacer"></div>
  <div id="listen" class="listen"><span class="dot"></span><span></span></div>
  <button id="sendBtn" class="btn primary" disabled>Send to Claude</button>
</header>

<main>
  <section class="viewer">
    <div id="banner" class="banner" hidden></div>
    <div id="stage" class="stage">
      <div id="frameBox" class="frame-box" hidden>
        <video id="video" playsinline preload="auto"></video>
        <div id="overlay" class="overlay" title="Click to play or pause. Drag to mark an area."></div>
      </div>
      <div id="empty" class="empty">Loading…</div>
    </div>

    <div class="transport">
      <button id="playBtn" class="icon-btn play" aria-label="Play"></button>
      <button id="prevBtn" class="icon-btn" aria-label="Back one frame" title="Back one frame (←)"></button>
      <button id="nextBtn" class="icon-btn" aria-label="Forward one frame" title="Forward one frame (→)"></button>
      <span id="time" class="time">0:00.00 / 0:00.00</span>
      <span id="frameNo" class="frame-no">frame 0</span>
      <span class="spacer"></span>
      <select id="speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
      </select>
      <button id="loopBtn" class="icon-btn" aria-label="Loop" aria-pressed="false" title="Loop"></button>
      <button id="muteBtn" class="icon-btn" aria-label="Mute" title="Mute"></button>
    </div>

    <div id="timeline" class="timeline" aria-label="Timeline">
      <div id="track" class="track"><div id="progress" class="progress"></div></div>
      <div id="playhead" class="playhead"></div>
      <div id="markers" class="markers"></div>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-meta">
        <button type="button" id="atChip" class="chip time-chip" title="Jump to this moment">At 0:00.00</button>
        <button type="button" id="endChip" class="chip ghost" title="Make this note cover a stretch of time">+ End point</button>
        <button type="button" id="areaChip" class="chip area" hidden title="Remove the marked area"></button>
        <button type="button" id="moveChip" class="chip ghost" hidden title="Move this note to where the playhead is now"></button>
      </div>
      <textarea id="noteText" class="note" rows="2" aria-label="Note"></textarea>
      <div id="attachList" class="attach-list" hidden></div>
      <div class="composer-actions">
        <button type="button" id="attachBtn" class="link" title="Attach an image, GIF, video or sound">Attach file</button>
        <input type="file" id="fileInput" multiple hidden accept="image/*,video/*,audio/*">
        <span class="hint">Drag on the video to mark an area · drop or paste images and GIFs · Space plays · ←/→ steps a frame</span>
        <button type="button" id="discardBtn" class="link" hidden>Discard</button>
        <button type="submit" id="addBtn" class="btn primary">Add note <kbd>⌘↵</kbd></button>
      </div>
    </form>
  </section>

  <aside class="panel" aria-label="Notes">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-filter="open" aria-selected="true">Open<span class="n" id="nOpen">0</span></button>
      <button class="tab" role="tab" data-filter="done" aria-selected="false">Done<span class="n" id="nDone">0</span></button>
      <button class="tab" role="tab" data-filter="all" aria-selected="false">All</button>
    </div>
    <div id="notes" class="notes"></div>
  </aside>
</main>

<div id="dropzone" class="dropzone" hidden>Drop to attach to your note</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const video = $("video");

const svg = (body) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
const ICON = {
  play: svg('<path class="f" d="M8 5.5v13l10.5-6.5z"/>'),
  pause: svg('<path class="f" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'),
  prev: svg('<path d="M7 5.5v13"/><path class="f" d="M18 6.5v11L9.5 12z"/>'),
  next: svg('<path d="M17 5.5v13"/><path class="f" d="M6 6.5v11l8.5-5.5z"/>'),
  sound: svg('<path class="f" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/>'),
  muted: svg('<path class="f" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>'),
  loop: svg('<path d="M17 3.5l3 3-3 3M20 6.5H8.5A4.5 4.5 0 0 0 4 11v.5M7 20.5l-3-3 3-3M4 17.5h11.5A4.5 4.5 0 0 0 20 13v-.5"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  undo: svg('<path d="M9 6.5L4.5 11 9 15.5"/><path d="M5 11h9.5a5 5 0 0 1 0 10H12"/>'),
  trash: svg('<path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/>'),
  area: svg('<rect x="4" y="5" width="16" height="14" rx="1.5" stroke-dasharray="3 2.5"/>'),
  file: svg('<path d="M7 3.5h7l4 4v13H7zM14 3.5v4h4"/>'),
};

const S = {
  state: null, docKey: "", rendersKey: "", offline: false,
  current: null, seen: 0, fps: 30, scale: 1,
  filter: "open", selected: null,
  draft: { frame: null, end: null, region: null, files: [], uploading: 0 },
  replyDrafts: {}, press: null, drag: null, scrub: false, overlayKey: "", playing: null,
};

// ------------------------------------------------------------ helpers

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "icon") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}

async function api(path, { method = "GET", body, headers = {} } = {}) {
  const opts = { method, headers: { ...headers }, cache: "no-store" };
  if (method !== "GET") opts.headers["X-Editor"] = "1";
  if (body !== undefined) {
    if (body instanceof Blob) opts.body = body;
    else { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `The editor answered ${res.status}`);
  return data;
}

let toastTimer;
function toast(msg, ms = 3200) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms);
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function fmt(t) {
  const cs = Math.round(Math.max(0, t) * 100);
  return `${Math.floor(cs / 6000)}:${((cs % 6000) / 100).toFixed(2).padStart(5, "0")}`;
}
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString();
}
const isImage = (name) => /\.(png|jpe?g|gif|webp|avif|svg)$/i.test(name);
const fileUrl = (path) => "/files/" + path.split("/").map(encodeURIComponent).join("/");

// ------------------------------------------------------------ frames and time

const dur = () => (Number.isFinite(video.duration) ? video.duration : S.current?.duration || 0);
const lastFrame = () => Math.max(0, Math.round(dur() * S.fps) - 1);
const frameAt = (t) => clamp(Math.floor(t * S.fps + 1e-6), 0, lastFrame());
const frameNow = () => frameAt(video.currentTime);
const noteFrame = (n) => clamp(Math.round(n.time * S.fps), 0, lastFrame());
function seekFrame(n) {
  if (!S.current) return;
  video.currentTime = (clamp(n, 0, lastFrame()) + 0.5) / S.fps;  // middle of the frame shows that frame
  tick();
}
function togglePlay() {
  if (!S.current) return;
  if (video.paused) { S.selected = null; refreshNotes(); video.play().catch(() => {}); }
  else video.pause();
}

// ------------------------------------------------------------ polling

async function poll() {
  try {
    applyState(await api("/api/state"));
    S.offline = false;
  } catch (err) {
    S.offline = true;
    if (!(err instanceof TypeError)) toast(err.message, 6000);
  }
  showListen();
}

function applyState(st) {
  S.state = st;
  $("project").textContent = st.project;
  document.title = `${st.project} · Video editor`;
  const rKey = JSON.stringify(st.renders.map((r) => [r.name, r.mtime]));
  if (rKey !== S.rendersKey) {
    S.rendersKey = rKey;
    const sel = $("renderSelect");
    sel.replaceChildren(...st.renders.map((r) => h("option", { value: r.name }, `${r.name} · ${ago(new Date(r.mtime * 1000).toISOString())}`)));
    sel.hidden = !st.renders.length;
    if (S.current) sel.value = S.current.name;
  }
  if (!S.current && st.renders.length) loadRender(st.renders[0]);
  const newest = st.renders[0];
  $("staleChip").hidden = !(st.stale && S.current && newest && newest.name === S.current.name);
  updateBanner();
  $("empty").hidden = !!S.current;
  if (!S.current) {
    $("empty").replaceChildren(h("div", {}, "No render yet.", h("br"), "Claude renders to ", h("code", {}, st.nextRender), " and it plays here."));
  }
  const key = JSON.stringify(st.doc);
  if (key !== S.docKey) { S.docKey = key; refreshNotes(); }
  updateSend();
}

function updateBanner() {
  const b = $("banner");
  const newest = S.state?.renders[0];
  if (!S.current || !newest || newest.mtime <= S.seen) { b.hidden = true; return; }
  const same = newest.name === S.current.name;
  b.replaceChildren(
    h("span", {}, same ? "This render was updated." : "New render: ", same ? null : h("strong", {}, newest.name)),
    h("button", { class: "btn small", onclick: () => loadRender(newest) }, "Watch it"),
  );
  b.hidden = false;
}

function loadRender(r) {
  const t = S.current ? video.currentTime : 0;
  S.current = r;
  S.fps = r.fps || 30;
  S.seen = Math.max(S.seen, S.state?.renders[0]?.mtime || r.mtime);
  video.src = `/renders/${encodeURIComponent(r.name)}?v=${Math.round(r.mtime)}`;
  video.addEventListener("loadedmetadata", () => {
    if (t) video.currentTime = Math.min(t, video.duration - 0.01);
    fit(); refreshNotes(); tick();
  }, { once: true });
  $("renderSelect").value = r.name;
  $("empty").hidden = true;
  $("frameBox").hidden = false;
  updateBanner();
  if (S.state) $("staleChip").hidden = !(S.state.stale && S.state.renders[0]?.name === r.name);
}

// ------------------------------------------------------------ claude status and sending

function pending(doc) { return !!doc.sent && (!doc.picked || doc.sent > doc.picked); }

function showListen() {
  const el = $("listen");
  let cls = "off", text = "Claude isn't listening", title = "Send still saves your notes and copies a message to paste into Claude.";
  if (S.offline) {
    text = "The editor stopped"; title = "Ask Claude to open the editor again.";
  } else if (S.state) {
    const { doc, listening } = S.state;
    const working = doc.picked && doc.notes.some((n) => n.status !== "done" && n.created <= doc.picked
      && !(n.replies || []).some((r) => r.by === "claude" && r.at >= doc.picked));
    if (pending(doc)) [cls, text, title] = listening ? ["busy", "Sending to Claude…", ""] : ["wait", "Sent. Waiting for Claude", "If nothing happens, tell Claude in the chat to check your notes."];
    else if (working && !listening) [cls, text, title] = ["busy", "Claude is working on your notes", "Replies appear on each note."];
    else if (listening) [cls, text, title] = ["on", "Claude is listening", "Click Send to Claude when your notes are ready."];
  }
  el.className = `listen ${cls}`;
  el.title = title;
  el.lastElementChild.textContent = text;
}

function newSince(doc) {
  return doc.notes.filter((n) => n.status !== "done" && (!doc.sent || n.created > doc.sent
    || (n.reopened && n.reopened > doc.sent)
    || (n.replies || []).some((r) => r.by === "you" && r.at > doc.sent))).length;
}

function updateSend() {
  const n = S.state ? newSince(S.state.doc) : 0;
  const btn = $("sendBtn");
  btn.disabled = !n;
  btn.textContent = n ? `Send ${n} ${n === 1 ? "note" : "notes"} to Claude` : "Send to Claude";
  btn.title = n ? "" : "Add a note first. Notes already sent stay with Claude.";
}

async function sendToClaude() {
  const st = S.state;
  if (!st) return;
  try {
    await api("/api/send", { method: "POST", body: {} });
    if (st.listening) toast("Sent. Claude replies on each note here.");
    else {
      const msg = `I left notes in the video editor for ${st.root}. Please work through them.`;
      try { await navigator.clipboard.writeText(msg); toast("Saved. Claude isn't listening, so a message is on your clipboard. Paste it into the chat.", 7000); }
      catch { toast(`Saved. Claude isn't listening. Tell Claude: "${msg}"`, 9000); }
    }
    await poll();
  } catch (err) { toast(err.message); }
}

// ------------------------------------------------------------ stage, overlay, timeline

function fit() {
  const W = video.videoWidth || S.current?.width, H = video.videoHeight || S.current?.height;
  if (!W || !H) return;
  const r = $("stage").getBoundingClientRect();
  S.scale = Math.min(r.width / W, r.height / H);
  $("frameBox").style.width = `${Math.floor(W * S.scale)}px`;
  $("frameBox").style.height = `${Math.floor(H * S.scale)}px`;
  S.overlayKey = "";
  renderOverlay();
}

function selectedNote() { return S.state?.doc.notes.find((n) => n.id === S.selected) || null; }

function renderOverlay() {
  const boxes = [];
  if (S.drag) boxes.push({ r: S.drag, cls: "box draft" });
  else if (S.draft.region) boxes.push({ r: S.draft.region, cls: "box draft", label: "New note" });
  const sel = selectedNote();
  if (sel?.region && video.paused) {
    const t = video.currentTime, slack = 1.5 / S.fps;
    if (t >= sel.time - slack && t <= (sel.end ?? sel.time) + slack) boxes.push({ r: sel.region, cls: "box", label: `#${sel.id}` });
  }
  const key = JSON.stringify(boxes) + S.scale;
  if (key === S.overlayKey) return;
  S.overlayKey = key;
  const k = S.scale;
  $("overlay").replaceChildren(...boxes.map((b) => {
    const el = h("div", { class: b.cls }, b.label ? h("span", { class: "tag" }, b.label) : null);
    Object.assign(el.style, { left: `${b.r.x * k}px`, top: `${b.r.y * k}px`, width: `${b.r.w * k}px`, height: `${b.r.h * k}px` });
    return el;
  }));
}

function renderMarkers() {
  const m = $("markers"), d = dur();
  if (!d || !S.state) { m.replaceChildren(); return; }
  const pct = (t) => `${clamp((t / d) * 100, 0, 100)}%`;
  const els = [];
  for (const n of S.state.doc.notes) {
    const done = n.status === "done" ? " done" : "";
    if (n.end != null) els.push(h("div", { class: `range${done}`, style: `left:${pct(n.time)};width:${pct(Math.max(0, Math.min(n.end, d) - n.time))}` }));
    els.push(h("button", {
      class: `marker${done}${S.selected === n.id ? " selected" : ""}`, style: `left:${pct(n.time)}`,
      title: `#${n.id} at ${fmt(n.time)}: ${n.text}`, "aria-label": `Note ${n.id} at ${fmt(n.time)}`,
      onpointerdown: (e) => e.stopPropagation(), onclick: () => selectNote(n),
    }, String(n.id)));
  }
  if (S.draft.frame != null) els.push(h("div", { class: "marker draft", style: `left:${pct(S.draft.frame / S.fps)}` }));
  m.replaceChildren(...els);
}

function tick() {
  const t = video.currentTime, d = dur();
  // Paused, show the start of the frame on screen, the same time a note records.
  $("time").textContent = `${fmt(video.paused && S.current ? frameNow() / S.fps : t)} / ${fmt(d)}`;
  $("frameNo").textContent = S.current ? `frame ${frameNow()} · ${S.fps} fps` : "";
  const p = d ? `${clamp((t / d) * 100, 0, 100)}%` : "0%";
  $("progress").style.width = p;
  $("playhead").style.left = p;
  if (S.playing !== !video.paused) {
    S.playing = !video.paused;
    $("playBtn").innerHTML = video.paused ? ICON.play : ICON.pause;
    $("playBtn").setAttribute("aria-label", video.paused ? "Play" : "Pause");
  }
  updateComposer();
  renderOverlay();
}
function loop() { tick(); if (!video.paused) requestAnimationFrame(loop); }

// ------------------------------------------------------------ composer

const hasDraft = () => !!($("noteText").value.trim() || S.draft.region || S.draft.files.length || S.draft.end != null);
function pinStart() { if (S.draft.frame == null && S.current) { S.draft.frame = frameNow(); renderMarkers(); } }

function updateComposer() {
  const pinned = S.draft.frame, f = pinned ?? frameNow(), now = frameNow();
  const at = $("atChip");
  at.textContent = `At ${fmt(f / S.fps)}`;
  at.classList.toggle("pinned", pinned != null);
  const move = $("moveChip");
  move.hidden = !(pinned != null && now !== pinned && video.paused);
  if (!move.hidden) move.textContent = `Move to ${fmt(now / S.fps)}`;
  $("endChip").textContent = S.draft.end != null ? `to ${fmt(S.draft.end)}  ✕` : "+ End point";
  $("endChip").classList.toggle("ghost", S.draft.end == null);
  const area = $("areaChip"), r = S.draft.region;
  area.hidden = !r;
  if (r) area.textContent = `Area ${r.w}×${r.h} at ${r.x}, ${r.y}  ✕`;
  $("discardBtn").hidden = !hasDraft() && pinned == null;
  $("noteText").placeholder = `What should change at ${fmt(f / S.fps)}?`;
}

function discardDraft() {
  S.draft = { frame: null, end: null, region: null, files: [], uploading: 0 };
  $("noteText").value = "";
  growNote();
  renderAttachments(); renderMarkers(); updateComposer(); renderOverlay();
}

function growNote() {
  const ta = $("noteText");
  ta.style.height = "auto";
  ta.style.height = `${Math.min(160, ta.scrollHeight)}px`;
}

function renderAttachments() {
  const list = $("attachList");
  list.hidden = !S.draft.files.length;
  list.replaceChildren(...S.draft.files.map((f) => h("div", { class: "file" },
    f.path && isImage(f.name) ? h("img", { src: fileUrl(f.path), alt: "" }) : h("div", { class: "ph", icon: ICON.file }),
    h("span", { title: f.path || f.name }, f.uploading ? `Uploading ${f.name}…` : f.name),
    f.uploading ? null : h("button", { type: "button", "aria-label": `Remove ${f.name}`, onclick: () => {
      S.draft.files = S.draft.files.filter((x) => x !== f); renderAttachments(); updateComposer();
    } }, "✕"),
  )));
}

async function attach(files) {
  if (!S.current) { toast("Wait for a render before attaching files."); return; }
  for (const file of files) {
    const item = { name: file.name, path: null, uploading: true };
    S.draft.files.push(item); S.draft.uploading++; video.pause(); pinStart(); renderAttachments(); updateComposer();
    try {
      const r = await api("/api/upload", { method: "POST", body: file, headers: { "X-Filename": encodeURIComponent(file.name) } });
      Object.assign(item, { path: r.path, name: r.name });
    } catch (err) {
      S.draft.files = S.draft.files.filter((x) => x !== item);
      toast(err.message, 5000);
    } finally {
      item.uploading = false; S.draft.uploading--; renderAttachments(); updateComposer();
    }
  }
}

async function capture(frame, region) {
  if (frameNow() !== frame) {
    await new Promise((resolve) => {
      video.addEventListener("seeked", resolve, { once: true });
      setTimeout(resolve, 1500);
      seekFrame(frame);
    });
  }
  try {
    const W = video.videoWidth, H = video.videoHeight, k = Math.min(1, 1280 / W);
    const c = h("canvas", { width: Math.round(W * k), height: Math.round(H * k) });
    const g = c.getContext("2d");
    g.drawImage(video, 0, 0, c.width, c.height);
    if (region) {
      const lw = Math.max(3, c.width / 280), r = [region.x * k, region.y * k, region.w * k, region.h * k];
      g.lineWidth = lw + 3; g.strokeStyle = "rgba(0,0,0,.7)"; g.strokeRect(...r);
      g.lineWidth = lw; g.strokeStyle = "#f5a524"; g.strokeRect(...r);
    }
    return c.toDataURL("image/jpeg", 0.85);
  } catch { return null; }
}

async function submitNote(e) {
  e?.preventDefault();
  const text = $("noteText").value.trim();
  if (!S.current) { toast("There's no render to leave notes on yet."); return; }
  if (!text) { toast("Type what should change first."); $("noteText").focus(); return; }
  if (S.draft.uploading) { toast("Wait for the upload to finish."); return; }
  const frame = S.draft.frame ?? frameNow();
  const btn = $("addBtn");
  btn.disabled = true;
  try {
    const snapshot = await capture(frame, S.draft.region);
    const note = await api("/api/notes", { method: "POST", body: {
      render: S.current.name, frame, fps: S.fps, end: S.draft.end, region: S.draft.region,
      size: [video.videoWidth, video.videoHeight], text,
      files: S.draft.files.filter((f) => f.path).map((f) => f.path), snapshot,
    } });
    discardDraft();
    $("noteText").blur();
    S.selected = note.id;
    if (S.filter === "done") setFilter("open");
    await poll();
    toast(`Added note #${note.id}.`);
  } catch (err) { toast(err.message, 5000); } finally { btn.disabled = false; }
}

// ------------------------------------------------------------ notes panel

function setFilter(f) {
  S.filter = f;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.filter === f)));
  refreshNotes();
}

function selectNote(n) {
  S.selected = n.id;
  video.pause();
  seekFrame(noteFrame(n));
  refreshNotes();
  document.querySelector(`.card[data-id="${n.id}"]`)?.scrollIntoView({ block: "nearest" });
}

async function setStatus(n, status) {
  try { await api(`/api/notes/${n.id}`, { method: "PATCH", body: { status } }); await poll(); }
  catch (err) { toast(err.message); }
}

async function deleteNote(n) {
  if (!confirm(`Delete note #${n.id}?`)) return;
  try {
    await api(`/api/notes/${n.id}`, { method: "DELETE" });
    if (S.selected === n.id) S.selected = null;
    await poll();
  } catch (err) { toast(err.message); }
}

async function sendReply(n, ta) {
  const text = ta.value.trim();
  if (!text) return;
  try {
    await api(`/api/notes/${n.id}/replies`, { method: "POST", body: { text } });
    delete S.replyDrafts[n.id];
    ta.value = "";
    await poll();
  } catch (err) { toast(err.message); }
}

function fileChip(path) {
  const name = path.split("/").pop();
  return h("a", { class: "file", href: fileUrl(path), target: "_blank", rel: "noopener", title: path, onclick: (e) => e.stopPropagation() },
    isImage(name) ? h("img", { src: fileUrl(path), alt: "" }) : h("div", { class: "ph", icon: ICON.file }),
    h("span", {}, name));
}

function card(n) {
  const done = n.status === "done";
  const other = S.current && n.render && n.render !== S.current.name;
  const replyBox = S.selected === n.id ? (() => {
    const ta = h("textarea", { rows: 1, placeholder: done ? "Reply to reopen…" : "Reply…", "data-reply-for": n.id, "aria-label": `Reply to note ${n.id}` });
    ta.value = S.replyDrafts[n.id] || "";
    ta.addEventListener("input", () => { S.replyDrafts[n.id] = ta.value; ta.style.height = "auto"; ta.style.height = `${Math.min(120, ta.scrollHeight)}px`; });
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(n, ta); } });
    return h("div", { class: "reply-box" }, ta, h("button", { class: "btn small", type: "button", onclick: () => sendReply(n, ta) }, "Reply"));
  })() : null;
  return h("article", {
    class: `card${done ? " done" : ""}${S.selected === n.id ? " selected" : ""}`, "data-id": n.id,
    onclick: (e) => { if (!e.target.closest("button, textarea, a")) selectNote(n); },
  },
  h("div", { class: "card-head" },
    h("span", { class: "num" }, `#${n.id}`),
    h("span", { class: "tc" }, fmt(n.time) + (n.end != null ? ` – ${fmt(n.end)}` : "")),
    n.region ? h("span", { title: `Marked area ${n.region.w}×${n.region.h}`, icon: ICON.area, style: "display:grid" }) : null,
    other ? h("span", { class: "tiny", title: `Left on ${n.render}` }, n.render.replace(/\.[^.]+$/, "")) : null,
    h("span", { class: "grow" }),
    h("button", { class: "icon-btn", title: done ? "Reopen" : "Mark done", "aria-label": done ? "Reopen" : "Mark done",
      icon: done ? ICON.undo : ICON.check, onclick: () => setStatus(n, done ? "open" : "done") }),
    h("button", { class: "icon-btn danger", title: "Delete", "aria-label": "Delete note", icon: ICON.trash, onclick: () => deleteNote(n) })),
  h("p", { class: "card-text" }, n.text),
  n.files?.length ? h("div", { class: "files" }, n.files.map(fileChip)) : null,
  n.replies?.length ? h("div", { class: "thread" }, n.replies.map((r) => h("div", { class: `reply ${r.by === "claude" ? "claude" : "you"}` },
    h("span", { class: "who" }, r.by === "claude" ? "Claude" : "You"), h("span", { class: "when" }, ago(r.at)),
    h("div", { class: "body" }, r.text)))) : null,
  replyBox);
}

function refreshNotes() {
  renderMarkers();
  const doc = S.state?.doc;
  if (!doc) return;
  const list = $("notes");
  const active = document.activeElement;
  const focusId = active?.dataset?.replyFor;
  const caret = focusId ? [active.selectionStart, active.selectionEnd] : null;
  const all = [...doc.notes].sort((a, b) => a.time - b.time || a.id - b.id);
  const open = all.filter((n) => n.status !== "done");
  $("nOpen").textContent = open.length;
  $("nDone").textContent = all.length - open.length;
  const shown = S.filter === "all" ? all : S.filter === "done" ? all.filter((n) => n.status === "done") : open;
  if (!all.length) {
    list.replaceChildren(h("div", { class: "hello" }, "No notes yet.", h("ul", {},
      h("li", {}, "Pause where something should change, type the note, and press ⌘↵."),
      h("li", {}, "Drag on the video to mark the area you mean."),
      h("li", {}, "Drop or paste an image or GIF to put it on screen there."),
      h("li", {}, "Set an end point when a note covers a stretch of time."),
      h("li", {}, "Click Send to Claude when you're done. Claude replies on each note."))));
  } else if (!shown.length) {
    list.replaceChildren(h("div", { class: "hello" }, S.filter === "open" ? "Nothing open. Every note is done." : "Nothing here yet."));
  } else {
    list.replaceChildren(...shown.map(card));
  }
  if (focusId) {
    const ta = list.querySelector(`[data-reply-for="${focusId}"]`);
    if (ta) { ta.focus(); ta.setSelectionRange(...caret); }
  }
  S.overlayKey = "";
  renderOverlay();
}

// ------------------------------------------------------------ wiring

$("playBtn").innerHTML = ICON.play;
$("prevBtn").innerHTML = ICON.prev;
$("nextBtn").innerHTML = ICON.next;
$("loopBtn").innerHTML = ICON.loop;
$("muteBtn").innerHTML = ICON.sound;

$("playBtn").onclick = togglePlay;
$("prevBtn").onclick = () => { video.pause(); seekFrame(frameNow() - 1); };
$("nextBtn").onclick = () => { video.pause(); seekFrame(frameNow() + 1); };
$("speed").onchange = (e) => { video.playbackRate = Number(e.target.value); };
$("loopBtn").onclick = () => { video.loop = !video.loop; $("loopBtn").setAttribute("aria-pressed", String(video.loop)); };
$("muteBtn").onclick = () => {
  video.muted = !video.muted;
  $("muteBtn").innerHTML = video.muted ? ICON.muted : ICON.sound;
  $("muteBtn").setAttribute("aria-label", video.muted ? "Unmute" : "Mute");
};
$("renderSelect").onchange = (e) => {
  const r = S.state?.renders.find((x) => x.name === e.target.value);
  if (r) loadRender(r);
};
$("sendBtn").onclick = sendToClaude;
document.querySelectorAll(".tab").forEach((t) => { t.onclick = () => setFilter(t.dataset.filter); });

video.addEventListener("play", () => { S.selected = null; requestAnimationFrame(loop); });
for (const ev of ["pause", "seeked", "timeupdate", "loadedmetadata", "ended"]) video.addEventListener(ev, tick);
video.addEventListener("error", () => { if (S.current) toast(`Couldn't play ${S.current.name}.`, 5000); });
new ResizeObserver(fit).observe($("stage"));

// composer
$("composer").addEventListener("submit", submitNote);
$("noteText").addEventListener("focus", () => video.pause());
$("noteText").addEventListener("input", () => { growNote(); if ($("noteText").value.trim()) pinStart(); updateComposer(); });
$("atChip").onclick = () => { video.pause(); seekFrame(S.draft.frame ?? frameNow()); };
$("moveChip").onclick = () => { S.draft.frame = frameNow(); if (S.draft.end != null && S.draft.end <= S.draft.frame / S.fps) S.draft.end = null; renderMarkers(); updateComposer(); };
$("endChip").onclick = () => {
  if (S.draft.end != null) { S.draft.end = null; updateComposer(); return; }
  if (!S.current) return;
  video.pause();
  if (S.draft.frame == null) {
    pinStart(); updateComposer();
    toast("Start set. Move the playhead to where this should end, then click End point again.", 5000);
    return;
  }
  const now = frameNow();
  if (now <= S.draft.frame) { toast(`Move the playhead past ${fmt(S.draft.frame / S.fps)} first, then click End point.`, 4500); return; }
  S.draft.end = Math.round((now / S.fps) * 1000) / 1000;
  updateComposer();
};
$("areaChip").onclick = () => { S.draft.region = null; updateComposer(); renderOverlay(); };
$("discardBtn").onclick = discardDraft;
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { attach([...e.target.files]); e.target.value = ""; };

// drawing an area on the frame
const overlay = $("overlay");
function pointIn(e) {
  const r = overlay.getBoundingClientRect();
  return { x: clamp(e.clientX - r.left, 0, r.width), y: clamp(e.clientY - r.top, 0, r.height) };
}
overlay.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || !S.current) return;
  overlay.setPointerCapture(e.pointerId);
  S.press = { ...pointIn(e), moved: false };
});
overlay.addEventListener("pointermove", (e) => {
  if (!S.press) return;
  const p = pointIn(e), a = S.press, k = S.scale;
  if (!a.moved && Math.hypot(p.x - a.x, p.y - a.y) < 6) return;
  if (!a.moved) { a.moved = true; video.pause(); pinStart(); }
  S.drag = { x: Math.min(p.x, a.x) / k, y: Math.min(p.y, a.y) / k, w: Math.abs(p.x - a.x) / k, h: Math.abs(p.y - a.y) / k };
  renderOverlay();
});
overlay.addEventListener("pointerup", () => {
  const a = S.press;
  S.press = null;
  if (!a) return;
  if (a.moved && S.drag) {
    const d = S.drag;
    S.draft.region = { x: Math.round(d.x), y: Math.round(d.y), w: Math.max(1, Math.round(d.w)), h: Math.max(1, Math.round(d.h)) };
    S.drag = null;
    updateComposer(); renderOverlay();
    $("noteText").focus();
  } else togglePlay();
});
overlay.addEventListener("pointercancel", () => { S.press = null; S.drag = null; renderOverlay(); });

// scrubbing
const timeline = $("timeline");
function scrubTo(e) {
  const r = $("track").getBoundingClientRect();
  seekFrame(Math.floor(clamp((e.clientX - r.left) / r.width, 0, 1) * dur() * S.fps));
  tick();
}
timeline.addEventListener("pointerdown", (e) => {
  if (!dur()) return;
  timeline.setPointerCapture(e.pointerId);
  S.scrub = true; video.pause(); scrubTo(e);
});
timeline.addEventListener("pointermove", (e) => { if (S.scrub) scrubTo(e); });
timeline.addEventListener("pointerup", () => { S.scrub = false; });
timeline.addEventListener("pointercancel", () => { S.scrub = false; });

// files: drop and paste
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; $("dropzone").hidden = false; } });
window.addEventListener("dragleave", (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $("dropzone").hidden = true; } });
window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("dropzone").hidden = true;
  attach([...e.dataTransfer.files]);
});
document.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); attach(files); }
});

// keyboard
document.addEventListener("keydown", (e) => {
  const tag = e.target.tagName;
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "noteText") { e.preventDefault(); submitNote(); return; }
  if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " || e.key === "k") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault(); video.pause();
    seekFrame(frameNow() + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? Math.round(S.fps) : 1));
  } else if (e.key === "c" || e.key === "n") { e.preventDefault(); $("noteText").focus(); }
  else if (e.key === "Escape") { S.selected = null; S.draft.region = null; refreshNotes(); updateComposer(); }
});

updateComposer();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
